name: CI

on:
  pull_request:
    paths: ["Formula/**", "Casks/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["Formula/**", "Casks/**", ".github/workflows/ci.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: brew style + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Installs Homebrew and taps this checkout as alliecatowo/tap.
      - uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main

      - name: Find changed formulae and casks
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'Formula/*.rb' 'Casks/*.rb' || true)
          else
            files=$(ls Formula/*.rb Casks/*.rb 2>/dev/null || true)
          fi
          formulae=$(echo "$files" | grep '^Formula/' | sed 's|Formula/||; s|\.rb$||' | tr '\n' ' ' || true)
          casks=$(echo "$files" | grep '^Casks/' | sed 's|Casks/||; s|\.rb$||' | tr '\n' ' ' || true)
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"
          echo "casks=$casks" >> "$GITHUB_OUTPUT"
          echo "Formulae: $formulae"
          echo "Casks: $casks"

      # Newest Homebrew wants post_install_steps in formulae (a DSL older brews
      # do not understand yet), so formulae keep the classic post_install and
      # skip that cop. Casks use postflight_steps and need no exception.
      - name: brew style
        env:
          EXCEPT: FormulaAudit/InstallSteps
        run: |
          set -euo pipefail
          for f in ${{ steps.changed.outputs.formulae }}; do brew style --except-cops "$EXCEPT" "alliecatowo/tap/$f"; done
          for c in ${{ steps.changed.outputs.casks }}; do brew style --cask "alliecatowo/tap/$c"; done

      # brew style above already ran the style cops, so skip them here:
      # --strict and --except-cops are mutually exclusive.
      - name: brew audit --strict (formulae)
        run: |
          set -euo pipefail
          # GoReleaser (patchrun) always writes `version`, which strict audit calls
          # redundant when the URL carries the version. That one finding is
          # tolerated for generated formulae; any other finding still fails.
          for f in ${{ steps.changed.outputs.formulae }}; do
            if out=$(brew audit --strict --except=style --formula "alliecatowo/tap/$f" 2>&1); then
              echo "$out"
              continue
            fi
            echo "$out"
            others=$(echo "$out" | grep '^  \* ' | grep -v 'is redundant with version scanned from URL' || true)
            if [ -n "$others" ]; then
              exit 1
            fi
            echo "::warning::$f: generated formula keeps a redundant version (tolerated)"
          done

  # Casks are macOS-only; `brew audit --cask` cannot load them on Linux.
  audit-cask:
    name: brew audit --cask
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main

      - name: Audit changed casks
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'Casks/*.rb' || true)
          else
            files=$(ls Casks/*.rb 2>/dev/null || true)
          fi
          for f in $files; do
            brew audit --strict --except=style --cask "alliecatowo/tap/$(basename "$f" .rb)"
          done

  # Install every formula from the tap on both OSes and run its binary, so a
  # missing Linux/macOS build or a broken download fails CI instead of users.
  install:
    name: install + --version (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main

      - name: brew install each formula and run it
        run: |
          set -euo pipefail
          for path in Formula/*.rb; do
            f=$(basename "$path" .rb)
            # Binary name differs from the formula name for a few formulae.
            case "$f" in
              ticket-master) bin=tm ;;
              alliecode) bin=ac ;;
              *) bin="$f" ;;
            esac
            # alliecode's CLI has no --version flag yet; --help still proves the binary runs.
            flag=--version
            [ "$f" = alliecode ] && flag=--help
            echo "::group::install $f"
            brew install "alliecatowo/tap/$f"
            "$(brew --prefix)/bin/$bin" "$flag" >/dev/null
            # GoReleaser-generated formulae (alliecode) define no test block.
            if grep -q '^  test do' "$path"; then brew test "alliecatowo/tap/$f"; fi
            echo "::endgroup::"
          done

  # Casks are macOS-only. Install each and run its linked CLI binary.
  install-cask:
    name: install cask + --version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main

      - name: brew install each cask and run it
        run: |
          set -euo pipefail
          for path in Casks/*.rb; do
            c=$(basename "$path" .rb)
            echo "::group::install --cask $c"
            brew install --cask "alliecatowo/tap/$c"
            # Some casks ship a bare .app with no CLI; others link a differently named binary.
            case "$c" in
              k9k) test -d /Applications/K9k.app ;;
              morbstack) test -e "$(brew --prefix)/bin/morb" ;;
              *) "$(brew --prefix)/bin/$c" --version ;;
            esac
            echo "::endgroup::"
          done
